# Rep counter tuning. Set FLEXIBLE_REP_COUNTER_CONFIG to use another file.

# Live validation after enabling flags (pull session NDJSON, then):
#   grep -E 'switch_debug|effective_min_range_gate|depth_recal_trigger_reason' events.ndjson
# Enable order: primary_recovery_* → scale_change_pct / trigger_on_range_collapse → scale_relative_range_gate → min_closed_streak

[app]
log_level = "INFO"

[vm]
# YOLO pose API base URL (fixed; no env URL fallbacks).
direct_url = "http://34.95.128.222:8000"
timeout_sec = 5.0
health_timeout_sec = 5.0

[predict]
# Max width (px) before JPEG encode; 0 = never downscale. Higher = sharper image / larger uploads; lower = faster, coarser pose.
resize_width = 0
# JPEG 1–100. Higher = better detail & larger payload; lower = smaller/faster but noisier keypoints.
jpeg_quality = 85

[rep]
# After calibration: peak may fall this fraction of the calibrated ROM below the locked avg peak (0–1). E.g. ROM=50 deg and pct=0.50 → peak must be ≥ avg_peak − 25. Higher = tolerate more ROM drift; lower = stricter, may drop reps if form shifts.
peak_margin_pct = 0.50
# After calibration: valley may rise this fraction of the calibrated ROM above the locked avg valley (0–1). E.g. ROM=50 deg and pct=0.50 → valley must be ≤ avg_valley + 25. Higher = looser; lower = stricter valleys.
valley_margin_pct = 0.50
# Degrees smoothed angle must move past a running extremum to flip up/down state. Tuned slightly lower for ~12 FPS local input.
hysteresis = 16
# Minimum frames since last peak/valley event before another can register. Slightly lower to reduce min_peak_distance blocks at ~12 FPS.
min_peak_distance = 4
# Rolling window p95−p5 spread (deg) required before reps count. Higher = only count when recent ROM is large; lower = gate opens sooner, small twitches may pass if other checks pass.
min_range_gate = 15
# Frames in the rolling range window. Higher = stabler spread estimate, slower to adapt; lower = faster adaptation, jumpier gate.
range_window_frames = 90
# Frames needed in that window before the range gate may open. Higher = longer “warm-up” before counting; lower = earlier counting possible.
range_min_samples = 12
# If |raw angle − last passed| < this (deg), reuse last value before smoothing. Higher = more jitter suppression, risk of freezing motion; 0 = off, all motion passes through.
angle_delta_deadband = 0
# Full rep cycles recorded before peak/valley averages lock (margins apply after). Slightly reduced to lock margins sooner.
calibration_reps = 2
# Lock calibration when certainty ≥ this (0 = disable certainty gate). Higher = need very consistent peaks/valleys; lower = lock despite more jitter.
calibration_certainty = 0.2
# If certainty still low, keep calibrating up to this many extra reps beyond calibration_reps before forcing lock. Higher = more patience; lower = force lock sooner.
calibration_force_extra_reps = 0
# Min milliseconds between rep increments. Higher = hard cap on rep speed; lower = allow rapid reps, risk of burst double-counts.
min_interval_ms = 300

[angle_selection]
# Minimum seconds of observation before angle lock is allowed. Slightly reduced for faster start at ~12 FPS.
min_sec = 1.6
# Minimum frames in buffer before lock allowed. Reduced so selection remains responsive at lower local FPS.
min_frames = 24
# Cap on buffered frames during selection (memory / how far back variance sees). Higher = longer history; lower = less memory, shorter context.
max_buffer_frames = 400
# Seconds after a failed variance pick before retrying. Higher = longer pause between retries; lower = retries sooner (may thrash).
retry_interval_sec = 2.0
# Rep-count leader must exceed this fraction of total selection reps. Higher = need clearer one-joint dominance; lower = easier to satisfy dominance path.
dominance_fraction = 0.6666666666666666
# Leader needs at least this many reps for dominance lock. Higher = more proof; lower = can lock with fewer reps.
min_leading_reps = 2
# Consecutive frames dominance must hold before locking to leader. Reduced for quicker lock with 12 FPS input.
dominance_streak_frames = 18
# Seconds observed before variance-based fallback can run if dominance has not locked. Slightly reduced for faster fallback.
variance_fallback_sec = 10.0
# During tracking, re-run variance selection at this interval (sec). Lower = faster adaptation to new exercise, higher = less churn.
reevaluate_every_sec = 0.75
# After a switch, wait at least this many seconds before allowing another switch. Higher = stabler lock, lower = more reactive.
switch_min_sec = 1.5
# Minimum displayed reps on the current joint before another runtime recalibration switch is allowed.
switch_min_reps = 10
# Candidate variance must beat current tracked joint by this ratio to switch (unless current fails gate). Higher = stricter switching.
# switch_variance_ratio = 1.2  # Temporarily disabled along with runtime recalibration/switching.
# Min median window variance for a joint to qualify. Higher = only very active angles pass; lower = weaker motion can win.
min_variance = 6.0
# Min smoothed ROM (max−min deg) for a joint to qualify. Higher = need large movement; lower = smaller ROM angles can be chosen.
min_range_deg = 16.0
# Winner’s variance must be ≥ runner_up × this (when runner-up > 0). Higher = need a clearer winner; lower = closer scores still pick a joint.
second_best_ratio = 1.15
# Min sliding windows with “active” variance for a candidate. Higher = stricter consistency; lower = fewer windows required.
min_active_windows = 3
# Moving-average window (samples) when smoothing angles for variance/ROM stats. Higher = smoother stats, slower detail; lower = noisier, more responsive.
smooth_window = 5

[dynamic_recalibration]
# Skip full runtime re-evaluation until this many raw reps have been counted after
# a joint lock/switch. Helps avoid early noisy candidate scans.
post_lock_min_raw_reps = 5
# Live tuning (Issue 2 — primary takes leadership from vertical_px fallback):
# primary_recovery_bypass_rep_cooldown = true
# primary_recovery_force_after_stale_reevals = 2
# primary_recovery_skip_score_margin = true

[dynamic_recalibration.vertical_px]
# Stale/handoff thresholds when tracking vertical_px (defaults match global behavior).
# min_closed_streak = 3
# force_after_stale_reevals = 8
# max_recent_range_px = 14.0

# Peak-detector overrides by signal modality (not by joint name). Omitted keys inherit [rep].
[rep.vertical_px]
hysteresis = 4.0
min_range_gate = 5.0
min_peak_distance = 3
range_min_samples = 8
# Live tuning (Issue 1 — counting at distance):
# scale_relative_range_gate = true
# min_scale_ratio = 0.75

[fallback_y_point]
# Arm fallback-only Y candidates after these bad-3-point conditions hold for this long.
arm_window_sec = 1.2
# Tracked 3-point joint is considered low quality under this score.
low_score_threshold = 0.40
# Minimum score needed for a Y fallback candidate to be armed.
arming_min_score = 0.62
# Any 3-point candidate at/above this score can disarm fallback.
primary_recovery_score = 0.60
# Additional fallback quality gates.
min_activity_score = 0.50
min_pose_score = 0.45
min_rom_score = 0.50
min_extrema_score = 0.40
min_completed_cycles = 2
baseline_min_samples = 20
baseline_window_frames = 90
baseline_short_window_frames = 24
baseline_max_slew_px_per_sec = 6.0
baseline_jump_frac = 0.25
min_cadence_score = 0.45
min_evidence_range_px = 8.0
require_baseline = true
streak_decay_grace_sec = 0.5

[depth_recalibration]
enabled = true
scale_change_pct = 0.18
baseline_jump_frac = 0.25
cooldown_sec = 2.0
observation_reps = 2
# Live tuning (Issue 1 — react to distance / dead Y signal):
# scale_change_pct = 0.14
# trigger_on_range_collapse = true
# defer_when_primary_recovered = true

# Selection gates by signal modality. Angle joints use [angle_selection] globals above.
[angle_selection.vertical_px]
min_variance = 4.0
min_range = 6.0
# Live tuning (Issue 1 — easier Y selection when far): min_range = 4.5
second_best_ratio = 1.10

[low_fps_safe_mode]
enabled = true
# Joint switches allowed per safe-mode entry (alternate-limb carryover still suppressed).
recalibration_attempts_per_entry = 1
enter_p50_ms = 75.0
enter_p90_ms = 200.0
exit_p50_ms = 67.0
exit_p90_ms = 100.0
enter_streak_frames = 6
exit_streak_frames = 10
interval_window_frames = 12
min_samples = 8
